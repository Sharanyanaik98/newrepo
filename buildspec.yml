version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing system dependencies..."
      # Dynamically calculate the date and append it to the global environment
      - TODAY=$(date +%Y-%m-%d)
      - echo "export TODAY=\"$TODAY\"" >> /etc/profile

  pre_build:
    commands:
      - echo "Validating core application files structure..."
      - test -f index.html || (echo "Critical Error: index.html missing!" && exit 1)

  build:
    commands:
      - echo "Packaging application configuration..."
      - echo "Current build date reference target is $TODAY"

  post_build:
    commands:
      - echo "Creating dated backup tracking directory in S3..."
      - zip -r website.zip ./* -x "buildspec.yml" "appspec.yml" "scripts/*"
      - aws s3 cp website.zip "s3://codepipeline-us-east-1-8f9af8579556-4737-9fe1-2571adaa37a7/archive/$TODAY/website.zip"
      - echo "Build execution complete successfully."

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - 'archive/**/*'
